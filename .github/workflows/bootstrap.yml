name: Import BF6 source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand project source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/bf6-source.tar.gz.b64
          base64 --decode /tmp/bf6-source.tar.gz.b64 > /tmp/bf6-source.tar.gz
          tar -xzf /tmp/bf6-source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import BF6 engine, HTTP API and interface"
          git push
